name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-request'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.2.1 or v0.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REQUESTED="$INPUT_VERSION"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            REQUESTED="$REF_NAME"
          else
            REQUESTED="$(sed -n 's/^version=//p' .github/release-request | head -n 1)"
          fi

          TAG="${REQUESTED#v}"
          TAG="v${TAG}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          SOURCE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('src/immich_auto_archive.py').read_text(encoding='utf-8')
          match = re.search(r'^VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]', text, re.MULTILINE)
          if not match:
              raise SystemExit('Could not read VERSION from src/immich_auto_archive.py')
          print(match.group(1))
          PY
          )"

          if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
            echo "Release $TAG does not match source VERSION=$SOURCE_VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=dist/immich-auto-archive-${VERSION}-installer.sh" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build standalone installer
        shell: bash
        run: bash scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify standalone installer payload
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          INSTALLER="${{ steps.version.outputs.asset }}"
          bash "$INSTALLER" --extract "$TMP"
          grep -F 'VERSION = "${{ steps.version.outputs.version }}"' \
            "$TMP/immich-auto-archive-${{ steps.version.outputs.version }}/src/immich_auto_archive.py"

      - name: Create tag when needed
        if: github.ref_type != 'tag'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists at $EXISTING, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already exists at this commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing installer asset."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            EXTRA_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "$ASSET" \
              --verify-tag \
              --title "Immich Auto Archive $TAG" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi
